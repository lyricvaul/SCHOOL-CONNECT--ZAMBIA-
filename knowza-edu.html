<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4c1d95">
<title>KNOWZA EDU | Founder Centre</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
:root {
  --purple: #6b21a8;
  --dark: #4c1d95;
  --light: #f3e8ff;
  --bg: #faf8ff;
  --text: #20152e;
  --muted: #6b6475;
  --border: #e9ddf5;
  --red: #b91c1c;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  line-height: 1.55;
}

header {
  background: #fff;
  border-bottom: 1px solid var(--border);
  padding: 17px 16px;
}

.header-inner, main {
  max-width: 1050px;
  margin: auto;
}

.brand {
  color: var(--dark);
  font-size: 21px;
  font-weight: 800;
}

.subtitle, .muted {
  color: var(--muted);
  font-size: 13px;
}

main { padding: 22px 16px 40px; }

.topline, .panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 18px;
}

.badge {
  display: inline-block;
  padding: 7px 15px;
  border-radius: 40px;
  background: var(--light);
  color: var(--purple);
  font-weight: 800;
}

a.button, button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 10px 14px;
  background: #fff;
  color: var(--dark);
  font: inherit;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  min-height: 42px;
}

button.primary {
  background: var(--purple);
  color: white;
  border-color: var(--purple);
}

button.danger {
  color: var(--red);
  border-color: #fecaca;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.hero {
  background: linear-gradient(135deg, #4c1d95, #7e22ce);
  color: white;
  border-radius: 20px;
  padding: 27px 22px;
  margin-bottom: 18px;
}
