<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SchoolConnect Zambia</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>

<body class="bg-slate-50">
    <main class="min-h-screen flex items-center justify-center py-12 px-4">
        <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl">

            <div class="text-center">
                <a href="index.html" class="inline-flex items-center space-x-2">
                    <div class="w-10 h-10 bg-blue-600 rounded flex items-center justify-center text-white font-bold">SC</div>
                    <span class="text-2xl font-bold text-blue-900">SchoolConnect Zambia</span>
                </a>

                <h1 class="mt-6 text-3xl font-extrabold text-gray-900">
                    Sign in
                </h1>

                <p class="mt-2 text-sm text-gray-600">
                    Access your SchoolConnect account
                </p>
            </div>

            <form id="login-form" class="mt-8 space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">
                        Email address
                    </label>

                    <input
                        id="email"
                        type="email"
                        autocomplete="email"
                        required
                        class="mt-1 block w-full px-3 py-3 border border-gray-300 rounded-md"
                        placeholder="Enter your email"
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        required
                        class="mt-1 block w-full px-3 py-3 border border-gray-300 rounded-md"
                        placeholder="Enter your password"
                    >
                </div>

                <button
                    id="login-button"
                    type="submit"
                    class="w-full py-3 px-4 rounded-md text-white bg-blue-600 hover:bg-blue-700 font-medium"
                >
                    Sign In Securely
                </button>

                <p id="login-message"
                   role="status"
                   aria-live="polite"
                   class="text-sm text-center text-red-600"></p>

                <p class="text-sm text-center text-gray-600">
                    Don't have an account?
                    <a href="registration.html" class="text-blue-600 hover:underline">
                        Register here
                    </a>
                </p>
            </form>
        </div>
    </main>

    <script>
        const form = document.getElementById("login-form");
        const message = document.getElementById("login-message");
        const button = document.getElementById("login-button");

        const dashboardRoutes = {
            student: "dashboard-student.html",
            teacher: "dashboard-teacher.html",
            headteacher: "dashboard-headteacher.html",
            creator: "dashboard-creator.html",
            parent: "dashboard-parent.html"
        };

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            message.textContent = "";
            message.className = "text-sm text-center text-red-600";
            button.disabled = true;
            button.textContent = "Signing in...";

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            try {
                if (!window.supabaseClient) {
                    throw new Error("The database connection is unavailable.");
                }

                const { data, error } =
                    await window.supabaseClient.auth.signInWithPassword({
                        email,
                        password
                    });

                if (error) throw error;

                if (!data.user) {
                    throw new Error("Unable to identify your account.");
                }

                const { data: profile, error: profileError } =
                    await window.supabaseClient
                        .from("profiles")
                        .select("role")
                        .eq("id", data.user.id)
                        .single();

                if (profileError || !profile) {
                    await window.supabaseClient.auth.signOut();
                    throw new Error(
                        "Your profile could not be found. Please contact support."
                    );
                }

                const destination = dashboardRoutes[profile.role];

                if (!destination) {
                    await window.supabaseClient.auth.signOut();
                    throw new Error(
                        "Your account role is not configured for dashboard access."
                    );
                }

                window.location.replace(destination);

            } catch (error) {
                console.error("Login error:", error);

                message.textContent =
                    error.message === "Invalid login credentials"
                        ? "Incorrect email or password. Please try again."
                        : error.message || "Unable to sign in. Please try again.";

                button.disabled = false;
                button.textContent = "Sign In Securely";
            }
        });
    </script>
</body>
</html>
