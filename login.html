<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SchoolConnect Zambia</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-slate-50">
    <div class="min-h-screen flex items-center justify-center py-12 px-4">
        <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl">

            <div class="text-center">
                <a href="index.html" class="inline-flex items-center space-x-2">
                    <div class="w-10 h-10 bg-blue-600 rounded flex items-center justify-center text-white font-bold">SC</div>
                    <span class="text-2xl font-bold text-blue-900">SchoolConnect Zambia</span>
                </a>

                <h2 class="mt-6 text-3xl font-extrabold text-gray-900">
                    Sign in
                </h2>

                <p class="mt-2 text-sm text-gray-600">
                    Access your SchoolConnect account
                </p>
            </div>

            <form id="login-form" class="mt-8 space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">
                        Email address
                    </label>

                    <input
                        id="email"
                        type="email"
                        autocomplete="email"
                        required
                        class="mt-1 block w-full px-3 py-3 border border-gray-300 rounded-md"
                        placeholder="Enter your email"
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        required
                        class="mt-1 block w-full px-3 py-3 border border-gray-300 rounded-md"
                        placeholder="Enter your password"
                    >
                </div>

                <button
                    id="login-button"
                    type="submit"
                    class="w-full py-3 px-4 rounded-md text-white bg-blue-600 hover:bg-blue-700 font-medium"
                >
                    Sign In Securely
                </button>

                <p id="login-message" role="status" aria-live="polite"
                   class="text-sm text-center text-red-600"></p>

                <p class="text-sm text-center text-gray-600">
                    Don't have an account?
                    <a href="registration.html" class="text-blue-600 hover:underline">
                        Register here
                    </a>
                </p>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lievtubbwtrcvsvnwwep.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_uIADMwZxePQGHUgDmrK_Xg_ASPOSkJ1";

        const db = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        const form = document.getElementById("login-form");
        const message = document.getElementById("login-message");
        const button = document.getElementById("login-button");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            message.textContent = "";
            button.disabled = true;
            button.textContent = "Signing in...";

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            try {
                const { data, error } = await db.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                if (data.user) {
                    message.className = "text-sm text-center text-green-600";
                    message.textContent =
                        "Login successful. Your account is authenticated, but dashboard access must be configured.";

                    // Do not trust a user-selected role or email metadata
                    // to grant access to protected dashboards.
                }
            } catch (error) {
                message.className = "text-sm text-center text-red-600";
                message.textContent =
                    "Unable to sign in. Check your email and password, then try again.";
            } finally {
                button.disabled = false;
                button.textContent = "Sign In Securely";
            }
        });
    </script>
</body>
    </html>
