<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platform Users | SchoolConnect Zambia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>

<body class="bg-slate-100 min-h-screen text-slate-800">
  <header class="bg-slate-900 text-white p-5">
    <div class="max-w-5xl mx-auto">
      <h1 class="text-2xl font-bold">SchoolConnect Zambia</h1>
      <p class="text-slate-300">Founder Control Centre</p>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 sm:p-6">
    <div class="bg-white rounded-xl shadow-sm p-5 mb-5">
      <h2 class="text-xl font-bold">Platform Users</h2>
      <p class="text-sm text-slate-600 mt-1">
        View registered profiles and their recognised platform roles.
      </p>

      <div id="status"
           role="status"
           aria-live="polite"
           class="mt-4 p-3 rounded-lg bg-blue-50 text-blue-900">
        Checking founder access...
      </div>

      <div class="flex flex-wrap gap-3 mt-4">
        <button id="refresh"
          class="rounded-lg bg-blue-700 text-white px-4 py-3">
          Refresh users
        </button>

        <a href="dashboard-founder.html"
          class="rounded-lg border border-slate-300 px-4 py-3">
          Back to Founder Dashboard
        </a>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm p-4 overflow-x-auto">
      <table class="w-full text-sm text-left">
        <thead class="bg-slate-100">
          <tr>
            <th class="p-3">Name</th>
            <th class="p-3">Role</th>
            <th class="p-3">Profile ID</th>
          </tr>
        </thead>
        <tbody id="users">
          <tr>
            <td colspan="3" class="p-4">Loading users...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

<script>
const client = window.supabaseClient;
const statusBox = document.getElementById("status");
const usersBody = document.getElementById("users");
const founderId = "cbd23269-8930-45f2-ba98-06466b612fc8";

let founderVerified = false;

function showStatus(message, isError = false) {
  statusBox.textContent = message;
  statusBox.className = "mt-4 p-3 rounded-lg " +
    (isError
      ? "bg-red-50 text-red-800"
      : "bg-blue-50 text-blue-900");
}

function addCell(row, value) {
  const cell = document.createElement("td");
  cell.className = "p-3 border-t border-slate-100";
  cell.textContent = value ?? "";
  row.appendChild(cell);
}

async function loadUsers() {
  if (!founderVerified) return;

  showStatus("Loading profiles...");
  usersBody.replaceChildren();

  try {
    const [profilesResult, adminsResult] = await Promise.all([
      client.from("profiles")
        .select("id, full_name, role")
        .order("full_name"),

      client.from("platform_admins")
        .select("user_id, full_name, role")
    ]);

    if (profilesResult.error) throw profilesResult.error;
    if (adminsResult.error) throw adminsResult.error;

    const profiles = profilesResult.data || [];
    const admins = adminsResult.data || [];

    const adminById = new Map(
      admins.map(admin => [admin.user_id, admin])
    );

    // Make sure the founder is shown even if their profile role
    // still says "student" in the profiles table.
    const founderAdmin = admins.find(
      admin =>
        admin.user_id === founderId &&
        admin.role === "founder" &&
        admin.full_name === "M.I.K-BRAINS"
    );

    if (!founderAdmin) {
      throw new Error(
        "The protected founder record could not be verified."
      );
    }

    const rows = profiles.map(profile => {
      const admin = adminById.get(profile.id);

      return {
        id: profile.id,
        name: admin ? admin.full_name : profile.full_name,
        role: admin ? admin.role : profile.role
      };
    });

    // If the founder record exists but the profile is missing,
    // show the founder record without inventing a profile.
    if (!rows.some(row => row.id === founderId)) {
      rows.unshift({
        id: founderId,
        name: founderAdmin.full_name,
        role: founderAdmin.role
      });
    }

    if (rows.length === 0) {
      const row = document.createElement("tr");
      const cell = document.createElement("td");
      cell.colSpan = 3;
      cell.className = "p-4";
      cell.textContent = "No profiles found.";
      row.appendChild(cell);
      usersBody.appendChild(row);
    }

    rows.forEach(user => {
      const row = document.createElement("tr");

      addCell(row, user.name || "Unnamed user");

      const roleCell = document.createElement("td");
      roleCell.className = "p-3 border-t border-slate-100";

      if (user.id === founderId && user.role === "founder") {
        const badge = document.createElement("span");
        badge.className =
          "inline-block rounded-full bg-purple-100 text-purple-800 px-3 py-1 font-semibold";
        badge.textContent = "Founder";
        roleCell.appendChild(badge);
      } else {
        roleCell.textContent = user.role || "Unassigned";
      }

      row.appendChild(roleCell);
      addCell(row, user.id);
      usersBody.appendChild(row);
    });

    showStatus(
      "Founder verified. Loaded " + rows.length +
      " account record(s). Founder role is read from platform_admins."
    );
  } catch (error) {
    console.error("Platform Users error:", error);
    showStatus(
      "Unable to load users: " + error.message +
      ". Check your connection and database permissions.",
      true
    );
  }
}

async function start() {
  try {
    if (!client) {
      throw new Error(
        "Supabase connection missing. Check supabase.js."
      );
    }

    const { data, error } = await client.auth.getSession();
    if (error) throw error;

    const user = data.session?.user;

    if (!user) {
      showStatus("Please sign in with your founder account.");
      window.location.replace("login.html");
      return;
    }

    const { data: admin, error: adminError } = await client
      .from("platform_admins")
      .select("user_id, full_name, role")
      .eq("user_id", user.id)
      .maybeSingle();

    if (adminError) throw adminError;

    if (
      !admin ||
      admin.role !== "founder" ||
      admin.full_name !== "M.I.K-BRAINS" ||
      admin.user_id !== founderId
    ) {
      showStatus("Access denied. Founder account not verified.", true);
      usersBody.replaceChildren();
      return;
    }

    founderVerified = true;
    await loadUsers();

  } catch (error) {
    console.error("Founder verification error:", error);
    showStatus(
      "Founder verification failed: " + error.message,
      true
    );
  }
}

document.getElementById("refresh").addEventListener(
  "click",
  loadUsers
);

start();
</script>
</body>
    </html>
