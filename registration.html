<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Institution Registration - SchoolConnect Zambia</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50">

    <main class="min-h-screen flex items-center justify-center py-12 px-4">

        <div class="max-w-md w-full space-y-6 bg-white p-8 rounded-2xl shadow-xl">

            <!-- Branding -->
            <div class="text-center">

                <a href="index.html"
                   class="inline-flex items-center space-x-2">

                    <div class="w-10 h-10 bg-blue-600 rounded flex items-center justify-center text-white font-bold">
                        SC
                    </div>

                    <span class="text-2xl font-bold text-blue-900">
                        SchoolConnect Zambia
                    </span>

                </a>

                <h1 class="mt-6 text-3xl font-extrabold text-gray-900">
                    Register Your Institution
                </h1>

                <p class="mt-2 text-sm text-gray-600">
                    Submit your institution for administrator review.
                </p>

            </div>

            <!-- Status message -->
            <div
                id="message"
                role="status"
                aria-live="polite"
                class="hidden rounded-md p-3 text-sm">
            </div>

            <!-- Registration form -->
            <form id="registrationForm" class="space-y-5">

                <!-- Institution name -->
                <div>

                    <label
                        for="school_name"
                        class="block text-sm font-medium text-gray-700">
                        Institution Name
                    </label>

                    <input
                        id="school_name"
                        name="school_name"
                        type="text"
                        required
                        minlength="2"
                        maxlength="200"
                        autocomplete="organization"
                        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2"
                        placeholder="e.g. Lusaka Secondary School">

                </div>

                <!-- Institution type -->
                <div>

                    <label
                        for="institution_type"
                        class="block text-sm font-medium text-gray-700">
                        Institution Type
                    </label>

                    <select
                        id="institution_type"
                        name="institution_type"
                        required
                        class="mt-1 block w-full rounded-md border border-gray-300 bg-white px-3 py-2">

                        <option value="">Select institution type</option>
                        <option value="primary">Primary School</option>
                        <option value="secondary">Secondary School</option>
                        <option value="college">College</option>
                        <option value="university">University</option>

                    </select>

                </div>

                <!-- Province -->
                <div>

                    <label
                        for="province"
                        class="block text-sm font-medium text-gray-700">
                        Province
                    </label>

                    <select
                        id="province"
                        name="province"
                        required
                        class="mt-1 block w-full rounded-md border border-gray-300 bg-white px-3 py-2">

                        <option value="">Select province</option>
                        <option value="Central">Central</option>
                        <option value="Copperbelt">Copperbelt</option>
                        <option value="Eastern">Eastern</option>
                        <option value="Luapula">Luapula</option>
                        <option value="Lusaka">Lusaka</option>
                        <option value="Muchinga">Muchinga</option>
                        <option value="North-Western">North-Western</option>
                        <option value="Northern">Northern</option>
                        <option value="Southern">Southern</option>
                        <option value="Western">Western</option>

                    </select>

                </div>

                <!-- District -->
                <div>

                    <label
                        for="district"
                        class="block text-sm font-medium text-gray-700">
                        District
                    </label>

                    <input
                        id="district"
                        name="district"
                        type="text"
                        required
                        minlength="2"
                        maxlength="100"
                        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2"
                        placeholder="e.g. Ndola">

                </div>

                <!-- Institution email -->
                <div>

                    <label
                        for="school_email"
                        class="block text-sm font-medium text-gray-700">
                        Institution Email
                    </label>

                    <input
                        id="school_email"
                        name="school_email"
                        type="email"
                        required
                        maxlength="254"
                        autocomplete="email"
                        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2"
                        placeholder="admin@school.zm">

                </div>

                <!-- Submit button -->
                <button
                    id="submitButton"
                    type="submit"
                    class="w-full rounded-md bg-blue-600 px-4 py-3 font-medium text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60">

                    Request Registration

                </button>

            </form>

            <!-- Notice -->
            <p class="text-center text-xs text-slate-500">
                Your request will remain pending until an authorised
                administrator reviews it. Submission does not guarantee
                approval.
            </p>

            <p class="text-center text-xs text-gray-500">
                Founded by M.I.K-BRAINS
            </p>

        </div>

    </main>

    <script>
        "use strict";

        // Form elements
        const form = document.getElementById("registrationForm");
        const button = document.getElementById("submitButton");
        const message = document.getElementById("message");

        // Supabase Edge Function endpoint
        const FUNCTION_URL =
            "https://lievtubbwtrcvsvnwwep.supabase.co/functions/v1/submit-school-registration";

        // Supabase publishable key
        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_uIADMwZxePQGHUgDmrK_Xg_ASPOSkJ1";

        // Display a message
        function showMessage(text, success) {

            message.textContent = text;

            message.className =
                "rounded-md p-3 text-sm " +
                (success
                    ? "bg-green-50 text-green-800"
                    : "bg-red-50 text-red-800");
        }

        // Submit institution registration
        form.addEventListener("submit", async function (event) {

            event.preventDefault();

            // Check required fields
            if (!form.reportValidity()) {
                return;
            }

            // Prevent duplicate submissions
            if (button.disabled) {
                return;
            }

            // Collect form data
            const data = {
                school_name:
                    document.getElementById("school_name").value.trim(),

                institution_type:
                    document.getElementById("institution_type").value,

                province:
                    document.getElementById("province").value,

                district:
                    document.getElementById("district").value.trim(),

                school_email:
                    document.getElementById("school_email").value.trim()
            };

            // Disable button while submitting
            button.disabled = true;
            button.textContent = "Submitting...";
            message.className = "hidden";

            try {

                const response = await fetch(FUNCTION_URL, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "apikey": SUPABASE_PUBLISHABLE_KEY
                    },

                    body: JSON.stringify(data)

                });

                // Read the server response
                const result = await response.json().catch(() => ({}));

                // Handle errors
                if (!response.ok) {

                    showMessage(
                        result.error ||
                        "We couldn't submit your request. Please try again later.",
                        false
                    );

                    return;
                }

                // Successful submission
                showMessage(
                    "Your institution registration request has been submitted successfully. It is now awaiting administrator review.",
                    true
                );

                // Clear form after success
                form.reset();

            } catch (error) {

                console.error(
                    "Institution registration error:",
                    error
                );

                showMessage(
                    "Unable to contact the registration service. Please check your internet connection and try again.",
                    false
                );

            } finally {

                // Restore button
                button.disabled = false;
                button.textContent = "Request Registration";

            }

        });
    </script>

</body>
                </html>
