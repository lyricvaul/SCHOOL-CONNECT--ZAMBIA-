<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institution Registration - SchoolConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl">
            <div class="text-center">
                <a href="index.html" class="inline-flex items-center space-x-2">
                    <div class="w-10 h-10 bg-blue-600 rounded flex items-center justify-center text-white font-bold">SC</div>
                    <span class="text-2xl font-bold text-blue-900">SchoolConnect</span>
                </a>
                <h2 class="mt-6 text-3xl font-extrabold text-gray-900">Register Your School</h2>
                <p class="mt-2 text-sm text-gray-600">Join the future of education management</p>
            </div>
            <form class="mt-8 space-y-6">
                <div class="rounded-md shadow-sm space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Institution Name</label>
                        <input type="text" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm" placeholder="e.g. Lusaka Primary School">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Institution Type</label>
                        <select class="block w-full px-3 py-2 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                            <option>Primary School</option>
                            <option>Secondary School</option>
                            <option>College</option>
                            <option>University</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Contact Email</label>
                        <input type="email" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm" placeholder="admin@school.zm">
                    </div>
                </div>

                <div>
                    <button type="button" onclick="alert('Feature requires Database & Email Service Integration')" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition">
                        Request Registration
                    </button>
                </div>
            </form>
            <p class="text-center text-xs text-slate-400">A system administrator will contact you within 24 hours to verify your institution credentials.</p>
        </div>
    </div>
</body>
</html>
