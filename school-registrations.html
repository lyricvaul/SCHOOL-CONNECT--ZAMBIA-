<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Registrations | SCZ</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>

<body class="bg-slate-100 text-slate-800">
    <header class="bg-blue-950 text-white p-5">
        <div class="max-w-5xl mx-auto">
            <h1 class="text-2xl font-bold">SchoolConnect Zambia</h1>
            <p class="mt-1">Founder Portal — School Registrations</p>
            <p class="text-sm text-blue-200">M.I.K-BRAINS</p>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-5">
        <a href="dashboard-founder.html"
           class="inline-block mb-5 text-blue-800 underline">
            ← Back to Founder Dashboard
        </a>

        <section class="bg-white rounded-xl border border-slate-200 p-5">
            <h2 class="text-xl font-bold">School Registration Requests</h2>

            <p class="text-slate-600 mt-2">
                View school applications submitted to SchoolConnect Zambia.
            </p>

            <p id="status"
               class="mt-5 text-sm whitespace-pre-wrap"
               aria-live="polite">
                Verifying founder access...
            </p>

            <div id="results" class="mt-5 overflow-x-auto"></div>
        </section>
    </main>

    <script>
    async function start() {
        const status = document.getElementById("status");
        const results = document.getElementById("results");
        const client = window.supabaseClient;

        try {
            if (!client) {
                throw new Error(
                    "Supabase did not load. Check supabase.js and the connection."
                );
            }

            // Check the current login session.
            const {
                data: sessionData,
                error: sessionError
            } = await client.auth.getSession();

            if (sessionError) throw sessionError;

            const user = sessionData.session?.user;

            if (!user) {
                window.location.replace("login.html");
                return;
            }

            // Verify that this account belongs to the platform founder.
            const {
                data: founder,
                error: founderError
            } = await client
                .from("platform_admins")
                .select("user_id, full_name, role")
                .eq("user_id", user.id)
                .maybeSingle();

            if (founderError) throw founderError;

            if (
                !founder ||
                founder.role !== "founder" ||
                founder.full_name !== "M.I.K-BRAINS"
            ) {
                status.textContent =
                    "Access denied. Founder access could not be verified.";
                return;
            }

            status.textContent =
                "Founder access verified. Loading registration requests...";

            // Load applications using the actual submission timestamp column.
            const {
                data,
                error: registrationError
            } = await client
                .from("school_registration_requests")
                .select(
                    "id, school_name, institution_type, province, district, status, submitted_at, school_code"
                )
                .order("submitted_at", { ascending: false });

            if (registrationError) {
                console.error(
                    "Registration query failed:",
                    registrationError
                );

                status.textContent =
                    "Founder access verified, but registration requests could not be loaded.\n\n" +
                    "Error: " + registrationError.message +
                    (registrationError.code
                        ? "\nCode: " + registrationError.code
                        : "") +
                    (registrationError.details
                        ? "\nDetails: " + registrationError.details
                        : "") +
                    (registrationError.hint
                        ? "\nHint: " + registrationError.hint
                        : "");

                return;
            }

            results.replaceChildren();

            if (!data || data.length === 0) {
                status.textContent =
                    "No registration requests found. New applications will appear here when submitted.";
                return;
            }

            // Build the table safely without inserting database text as HTML.
            const table = document.createElement("table");
            table.className =
                "w-full text-sm text-left border-collapse";

            const columns = [
                ["school_code", "School Code"],
                ["school_name", "School Name"],
                ["institution_type", "Institution Type"],
                ["province", "Province"],
                ["district", "District"],
                ["status", "Application Status"],
                ["submitted_at", "Date Submitted"]
            ];

            const thead = document.createElement("thead");
            thead.className = "bg-slate-100";

            const headerRow = document.createElement("tr");

            columns.forEach(([, label]) => {
                const th = document.createElement("th");
                th.className =
                    "p-3 border border-slate-200 font-semibold";
                th.textContent = label;
                headerRow.appendChild(th);
            });

            thead.appendChild(headerRow);
            table.appendChild(thead);

            const tbody = document.createElement("tbody");

            data.forEach(record => {
                const row = document.createElement("tr");
                row.className = "hover:bg-slate-50";

                columns.forEach(([key]) => {
                    const cell = document.createElement("td");
                    cell.className =
                        "p-3 border border-slate-200";

                    const value = record[key];

                    if (key === "submitted_at" && value) {
                        const date = new Date(value);

                        cell.textContent = Number.isNaN(date.getTime())
                            ? String(value)
                            : date.toLocaleString();
                    } else {
                        cell.textContent =
                            value === null || value === undefined || value === ""
                                ? "—"
                                : String(value);
                    }

                    row.appendChild(cell);
                });

                tbody.appendChild(row);
            });

            table.appendChild(tbody);
            results.appendChild(table);

            status.textContent =
                "Successfully loaded " +
                data.length +
                " registration request(s).";

        } catch (error) {
            console.error("School registration page error:", error);

            status.textContent =
                "Unable to load registrations.\n\n" +
                "Error: " +
                (error.message || "An unexpected error occurred.");
        }
    }

    start();
    </script>
</body>
    </html>
