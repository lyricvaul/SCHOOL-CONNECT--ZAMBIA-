<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080710">

  <title>Security Centre | SchoolConnect Zambia</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    :root {
      --black: #080710;
      --panel: #10101d;
      --panel2: #171326;
      --purple: #8b35db;
      --purple-light: #e4baff;
      --gold: #f5c84c;
      --silver: #d4d6e3;
      --white: #f8f7ff;
      --muted: #aaa7bd;
      --border: #383148;
      --green: #43e58b;
      --red: #ff707b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(ellipse at top left, #29104b 0, transparent 35%),
        var(--black);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.55;
    }

    button, a {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      padding: 15px 20px;
      background: linear-gradient(110deg, #260c43, #0c0a16 65%, #281044);
      border-bottom: 2px solid var(--gold);
    }

    .topbar-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: clamp(18px, 4vw, 25px);
      font-weight: 900;
    }

    .brand span {
      color: var(--gold);
    }

    .brand-sub {
      color: var(--silver);
      font-size: 12px;
    }

    .founder-chip {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 15px;
      border: 1px solid var(--purple);
      border-radius: 30px;
      background: #160d25;
    }

    .crown {
      color: var(--gold);
      font-size: 23px;
    }

    .role-badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 25px;
      background: var(--purple);
      color: white;
      font-size: 12px;
      font-weight: 800;
    }

    .layout {
      max-width: 1200px;
      margin: auto;
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr);
      min-height: 85vh;
    }

    aside {
      padding: 20px 12px;
      border-right: 1px solid var(--border);
      background: #090812;
    }

    .nav-link {
      display: block;
      margin-bottom: 8px;
      padding: 11px;
      border: 1px solid transparent;
      border-radius: 12px;
      color: var(--silver);
      font-size: 14px;
    }

    .nav-link:hover,
    .nav-link.active {
      border-color: var(--gold);
      background: #21152e;
      color: var(--gold);
    }

    .side-founder {
      margin-top: 40px;
      padding: 15px 5px;
      text-align: center;
      border-top: 1px solid var(--border);
    }

    .side-founder .crown {
      font-size: 35px;
    }

    .side-founder strong {
      display: block;
    }

    .side-founder small {
      color: var(--purple-light);
    }

    main {
      min-width: 0;
      padding: 22px;
    }

    .page-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .badge {
      display: inline-block;
      padding: 7px 17px;
      border-radius: 30px;
      background: #301345;
      border: 1px solid var(--purple);
      color: var(--purple-light);
      font-weight: 800;
    }

    .button {
      display: inline-block;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel);
      color: var(--silver);
      padding: 9px 13px;
    }

    .button:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 25px;
      margin-bottom: 18px;
      border: 1px solid #50316e;
      border-radius: 20px;
      background:
        radial-gradient(ellipse at right, #522078 0, transparent 55%),
        linear-gradient(120deg, #171025, #080913);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 240px;
      height: 5px;
      right: -35px;
      bottom: 18px;
      background: linear-gradient(90deg, var(--purple), var(--gold));
      transform: rotate(-20deg);
      opacity: .85;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(28px, 6vw, 42px);
      line-height: 1.15;
      margin: 10px 0;
    }

    h1 span {
      color: var(--gold);
    }

    .hero p {
      color: var(--silver);
      max-width: 670px;
      margin-bottom: 0;
    }

    h2 {
      font-size: 20px;
      margin: 24px 0 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      min-width: 0;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: linear-gradient(145deg, #131321, #0b0b14);
    }

    .card.gold-edge {
      border-top: 2px solid #8f7129;
    }

    .card.purple-edge {
      border-top: 2px solid var(--purple);
    }

    .icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid var(--purple);
      border-radius: 50%;
      color: var(--purple-light);
      font-size: 21px;
      margin-bottom: 9px;
    }

    .gold-edge .icon {
      border-color: var(--gold);
      color: var(--gold);
    }

    .card h3 {
      font-size: 14px;
      margin: 5px 0;
    }

    .card p {
      color: var(--muted);
      font-size: 13px;
      margin: 3px 0 9px;
      overflow-wrap: anywhere;
    }

    .status {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 20px;
      background: #18271f;
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      border: 1px solid #286444;
    }

    .status.pending {
      color: var(--gold);
      background: #29210e;
      border-color: #72581b;
    }

    .status.unknown {
      color: var(--silver);
      background: #20202d;
      border-color: #56566b;
    }

    .status.failed {
      color: var(--red);
      background: #32151c;
      border-color: #75313c;
    }

    .columns {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
      margin-top: 18px;
    }

    .panel {
      min-width: 0;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: linear-gradient(145deg, #11111f, #090912);
    }

    .panel h2 {
      margin-top: 0;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .check-row,
    .data-row,
    .pending-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #272536;
      font-size: 13px;
    }

    .check-row:last-child,
    .data-row:last-child,
    .pending-row:last-child {
      border-bottom: 0;
    }

    .check-row .label {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .tick {
      color: var(--green);
      font-weight: 900;
      margin-right: 8px;
    }

    .warning {
      color: var(--gold);
      font-weight: 900;
      margin-right: 8px;
    }

    .data-row .key {
      color: var(--muted);
      flex: 0 0 36%;
    }

    .data-row .value {
      text-align: right;
      overflow-wrap: anywhere;
    }

    .reminders {
      padding-left: 20px;
      color: var(--silver);
      font-size: 13px;
    }

    .reminders li {
      padding: 5px 0;
    }

    .gold-box {
      border: 1px solid var(--gold);
      background: #17130c;
      padding: 13px;
      margin-top: 15px;
      border-radius: 12px;
      color: var(--gold);
      font-size: 13px;
    }

    .gold-box p {
      margin: 4px 0 0;
      color: var(--silver);
    }

    .footer-banner {
      margin-top: 18px;
      padding: 17px;
      border: 1px solid var(--gold);
      border-radius: 15px;
      background: linear-gradient(100deg, #2a1b0b, #140e20, #3a2260);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .footer-banner strong {
      color: var(--gold);
    }

    .footer-banner small {
      color: var(--silver);
    }

    footer {
      padding: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px solid var(--border);
    }

    #loading,
    #access-error {
      max-width: 650px;
      margin: 40px auto;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--panel);
    }

    #access-error {
      display: none;
      border-color: var(--gold);
    }

    #dashboard {
      display: none;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .layout {
        grid-template-columns: 145px minmax(0, 1fr);
      }

      main {
        padding: 15px;
      }

      aside {
        padding: 15px 8px;
      }
    }

    @media (max-width: 620px) {
      .layout {
        display: block;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--border);
        padding: 9
